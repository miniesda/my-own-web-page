<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Train AR Example</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="overflow: hidden;">

    <!-- Overlay text before enabling the scene -->
    <div id="startOverlay" 
        style="width: 100%; height: 100%; 
                display: flex; flex-direction: column; 
                justify-content: center; align-items: center;
                background: rgba(0,0,0,0.7); cursor: pointer; text-align: center;">

        <p style="color: white; font-size: 1.5em;">Please take a seat</p>
        <p style="color: white; font-size: 1.5em;">and place the QR in</p>
        <p style="color: white; font-size: 1.5em;">the center of the screen</p>

        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://http://127.0.0.1:5500/prototipo1.html" 
        alt="Scan QR" 
        style="display:block; margin:auto; opacity: 0.5;">
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false" 
             vr-mode-ui="enabled: false" 
             id="arScene" 
             style="display: none;">

      <a-assets>
        <img id="suelo-borde" src="https://as2.ftcdn.net/jpg/02/32/67/69/1000_F_232676943_gvwMLQ0inuFDk3jSyU97AEK8uiRM8UUf.jpg" />
        <img id="suelo" src="https://t4.ftcdn.net/jpg/03/58/63/43/360_F_358634341_Q9T97z401tGXk9L24Q7W61LMaBi5IYXY.jpg" />
      </a-assets>

      <a-camera id="camera"></a-camera>

        <a-nft
        type="nft"
        url="./assets-prototipos/plano-metro-sevilla-web"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5">
          <a-box position="0 0 0" color="red"></a-box>
      </a-nft>

    </a-scene>
  </body>
</html>
