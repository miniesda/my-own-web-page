<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-gps.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            embedded
            loading-screen="enabled: false;"
            arjs="sourceType: webcam; debugUIEnabled: false;"
        >
                <a-image
                    src="assets-prototipos/qr.jpg"
                    look-at="[gps-camera]"
                    scale="1 1 1"
                    gps-entity-place="latitude: 40.287578548079296; longitude: -363.7841321434827;"
                ></a-image>

            <a-camera gps-camera rotation-reader id="cam"></a-camera>
        </a-scene>
        <p id="info" style="position: fixed; bottom: 10px; left: 10px; color: rgb(255, 0, 0);">info</p>
        <script>
          const camera = document.getElementById('cam');
          const output = document.getElementById('info');

          camera.addEventListener('gps-camera-update-position', (e) => {
          const { latitude, longitude, accuracy } = e.detail.position;

          output.innerHTML = `
            Latitude: ${latitude}<br>
            Longitude: ${longitude}<br>
            Accuracy: ${accuracy}
          `;
          console.log(output.innerHTML);
          });
        </script>
    </body>
</html>
