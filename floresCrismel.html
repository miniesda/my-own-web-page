<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
    <title>Flores amarillas para Crismel!</title>
  </head>
  <body>
    <style>
      body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle, #161616, #030303);
        overflow: hidden;
        text-align: center;
        color: aqua;
      }
    </style>

    <h1>Flores amarillas para Crismel!</h1>
    <a-scene>
        <a-assets>
            <a-asset-item id="flowerModel" src="./cake-1/floresCrismel.glb"></a-asset-item>
        </a-assets>
        <a-entity id="flower" class="clickable" gltf-model="#flowerModel" position="0 0 2" rotation="0 0 0" scale="0.5 0.5 0.5"></a-entity>
        <a-entity camera orbit-controls="target: 0 0 0; minDistance: 5; maxDistance: 50; initialPosition: 30 15 0; 
            autoRotate: true; autoRotateSpeed: 0.1; 
            enableDamping: false; enableRotation: true; 
            enableZoom: true; zoomSpeed: 0.5; rotateSpeed:0.75;">
            <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
        </a-entity>
        <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
        <a-light type="directional" color="#ffffff" intensity="2" position="0 10 10"></a-light>
    </a-scene>
  </body>
