<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
  </head>
  <body>
    <style>
      body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle, #161616, #030303);
        overflow: hidden;
        text-align: center;
        color: aqua;
      }
    </style>
    <!--
    <h1>Happy Birthday! Swipe the screen to enjoy your 3D cake</h1>
    (you can tap it to receive a gift)
    -->
    <!--
    <h1>Feliz cumpleaños! Desliza por la pantalla para disfrutar de tu tarta en 3D</h1>
    (puedes pulsarla para recibir un regalo)
    -->
    <h1>生日快乐! 滑动屏幕欣赏你的3D蛋糕</h1>
    (你可以点击它来收到礼物)

    <a-scene>
        <a-assets>
            <a-asset-item id="cakeModel1" src="./cake-1/4.glb"></a-asset-item>
            <a-asset-item id="cakeModel0" src="./cake-1/41.glb"></a-asset-item>
        </a-assets>
            <a-entity id="cake" class="clickable" gltf-model="#cakeModel1" position="0 0 0" rotation="0 0 0" scale="40 40 40"></a-entity>
            <a-entity id="cake1" class="clickable" gltf-model="#cakeModel0" position="0 0 0" rotation="0 0 0" scale="40 40 40"></a-entity>
        <a-entity camera orbit-controls="target: 0 0 0; minDistance: 5; maxDistance: 5; initialPosition: -2 2 -3; 
            autoRotate: true; autoRotateSpeed: 0.5; 
            enableDamping: false; enableRotation: true; 
            enableZoom: true; zoomSpeed: 0.5; rotateSpeed:0.75;">
            <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
        </a-entity>
    </a-scene>
    
  </body>

  <script>
    let cake = document.getElementById('cake');
    let cake1 = document.getElementById('cake1');
    let isCandleLit = true;

    setInterval(() => {
        if (isCandleLit) {
            cake.setAttribute('visible', 'false');
            cake1.setAttribute('visible', 'true');
        } else {
            cake.setAttribute('visible', 'true');
            cake1.setAttribute('visible', 'false');
        }
        isCandleLit = !isCandleLit;
    }, 1000);

    document.querySelector('.clickable').addEventListener('click', function () {
        //alert("¡¡Estas viejaa!! 🫵🏻👵🏻");
        //alert("¡¡You are old!! 🫵👵");
        alert("你老啦! ! 🫵🏻👵🏻");
    });
  </script>
</html>
