<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flores amarillas para Crismel 💛</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Trebuchet MS", Arial, sans-serif;

            background: linear-gradient(135deg,
                    #fff8d6,
                    #ffe8ef);

            overflow: hidden;
        }

        .container {
            width: min(90%, 500px);
            padding: 40px 25px;

            text-align: center;

            background: rgba(255, 255, 255, 0.85);
            border-radius: 30px;

            box-shadow:
                0 15px 40px rgba(255, 190, 80, 0.25);

            animation: appear 0.8s ease;
        }

        h1 {
            color: #d99b00;
            font-size: clamp(1.7rem, 5vw, 2.4rem);
            margin-bottom: 25px;
        }

        #tit2 {
            display: none;
            color: #e78b9c;
        }

        .cat {
            width: 220px;
            max-width: 80%;
            margin: 10px auto 25px;

            display: block;

            border-radius: 20px;

            filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.12));

            animation: float 3s ease-in-out infinite;
        }

        #angrycat {
            display: none;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 13px 24px;

            border-radius: 50px;

            font-size: 1rem;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        #yesButton {
            background: #ffd84d;
            color: #765600;

            box-shadow: 0 6px 15px rgba(255, 205, 50, 0.35);
        }

        #noButton {
            background: #ffdce5;
            color: #b85c70;
        }

        button:hover {
            transform: translateY(-3px) scale(1.04);
        }

        button:active {
            transform: scale(0.96);
        }

        .flower {
            position: fixed;
            font-size: 25px;
            pointer-events: none;
            animation: fall linear infinite;
            opacity: 0.7;
        }

        .flower:nth-child(1) {
            left: 10%;
            animation-duration: 7s;
        }

        .flower:nth-child(2) {
            left: 30%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .flower:nth-child(3) {
            left: 65%;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .flower:nth-child(4) {
            left: 85%;
            animation-duration: 10s;
            animation-delay: 3s;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes fall {
            from {
                top: -50px;
                transform: rotate(0deg);
            }

            to {
                top: 110vh;
                transform: rotate(360deg);
            }
        }

        .big {
            transform: scale(1.3);
        }

        #brokenButton {
            display: none;
            position: relative;
            overflow: hidden;
            background: #ffdce5;
            color: #999;
            border: 2px dashed #aaa;
            border-radius: 50px;
            cursor: not-allowed;
            opacity: 0.9;
            transform: rotate(-2deg) scale(0.8);
            box-shadow: none;
        }

        /* Big obvious crack */
        #brokenButton .crack {
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 45px;
            transform: translateY(-50%);
            pointer-events: none;
        }

        #brokenButton .crack polyline {
            fill: none;
            stroke: #7777776c;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Small crack branches */
        #brokenButton .crack::after {
            content: "";
        }

        /* Don't let the text change on hover */
        #brokenButton:hover {
            transform: rotate(-2deg);
        }
    </style>
</head>

<body>

    <!-- Flores decorativas -->
    <div class="flower">🌼</div>
    <div class="flower">🌻</div>
    <div class="flower">🌼</div>
    <div class="flower">🌻</div>

    <main class="container">

        <h1 id="tit1">
            ¿Quieres recibir flores amarillas, Crismel?😻💛
        </h1>

        <h1 id="tit2">
            ¡Prueba otra vez!😾🌼
        </h1>

        <img src="imagenes/happycatFlower.png" alt="Gatito feliz con flores amarillas" class="cat" id="happycat">

        <img src="imagenes/angrycatFlower.png" alt="Gatito enfadado con flores amarillas" class="cat" id="angrycat">

        <div class="buttons">
            <button id="yesButton" onclick="window.location.href='floresCrismel.html'"> 🌼 ¡Sí, quiero! </button>

            <button id="noButton" onclick="sayNo()"> No, gracias 😿 </button>

            <!-- Broken version -->
            <button id="brokenButton" type="button" class="small" disabled> 
                <svg class="crack" viewBox="0 0 300 50"
                    preserveAspectRatio="none">
                    <polyline
                        points=" 0,22 25,28 45,12 65,35 90,15 115,30 140,8 165,38 190,18 215,32 240,10 265,28 300,20 " />
                </svg> 
                💔
            </button>
        </div>

    </main>

    <script>
        function sayNo() {
            document.getElementById("tit1").style.display = "none";
            document.getElementById("tit2").style.display = "block";

            document.getElementById("happycat").style.display = "none";
            document.getElementById("angrycat").style.display = "block";

            document.getElementById("noButton").style.display = "none";
            document.getElementById("brokenButton").style.display = "block";

            document.getElementById("yesButton").classList.add("big");
        }
    </script>

</body>

</html>
