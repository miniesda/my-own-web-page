<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Train AR Example</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="overflow: hidden;">

    <!-- Overlay text before enabling the scene -->
    <div id="startOverlay" 
        style="width: 100%; height: 100%; 
                display: flex; flex-direction: column; 
                justify-content: center; align-items: center;
                background: rgba(0,0,0,0.7); cursor: pointer; text-align: center;">

        <p style="color: white; font-size: 1.5em;">Please take a seat</p>
        <p style="color: white; font-size: 1.5em;">and place the QR in</p>
        <p style="color: white; font-size: 1.5em;">the center of the screen</p>

        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://http://127.0.0.1:5500/prototipo1.html" 
        alt="Scan QR" 
        style="display:block; margin:auto; opacity: 0.5;">
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false" 
             vr-mode-ui="enabled: false" 
             id="arScene" 
             style="display: none;">

      <a-assets>
        <img id="suelo-borde" src="https://as2.ftcdn.net/jpg/02/32/67/69/1000_F_232676943_gvwMLQ0inuFDk3jSyU97AEK8uiRM8UUf.jpg" />
        <img id="suelo" src="https://t4.ftcdn.net/jpg/03/58/63/43/360_F_358634341_Q9T97z401tGXk9L24Q7W61LMaBi5IYXY.jpg" />
      </a-assets>

      <a-entity id="cameraRig">
        <a-camera position="0 0 0" look-controls touchEnabled="false" fov="70"></a-camera>
      </a-entity>

      <a-entity id="train"
                gltf-model="https://s3-eu-west-1.amazonaws.com/fetchcfd/original/file-1571063936882.glb" 
                rotation="0 90 0"
                scale="10 10 10"
                position="-5 -0 -20">
      </a-entity>
      <a-entity id="person" 
                gltf-model="https://threejs.org/examples/models/gltf/Soldier.glb" 
                rotation="0 180 0"
                scale="1 1 1"
                position="1.1 -1.5 -10">
      </a-entity>
      <a-plane id="plane1"
                rotation="-90 180 0"
                scale="100 20 1"
                position="0 -1.5 -7"
                material="src:#suelo; repeat:100 20">
      </a-plane>
      <a-plane id="plane2"
                rotation="-90 0 0"
                scale="100 1 1"
                position="0 -1.45 -17"
                material="src:#suelo-borde; repeat:100 1"
                color="yellow">
      </a-plane>
      <a-text value=
      "Hola, soy tu historiador
      del metro, hoy aprenderemos
      historia de la Linea 1"
              id="text1"
              rotation="0 0 0" 
              color="#FFF"
              aling="center"
              scale="0.5 0.5 0.5"
              position="-1 -0.5 -10">
      </a-text>

    </a-scene>

    <script>
    const overlay = document.getElementById("startOverlay");
    const scene = document.getElementById("arScene");

    overlay.addEventListener("click", () => {
        overlay.style.display = "none";
        scene.style.display = "block";

        const rig = document.getElementById("cameraRig").object3D;
        const cam = document.getElementById("camera").object3D;

        cam.updateMatrixWorld();

        const camQuat = cam.quaternion.clone();

        const correctionQuat = camQuat.invert();

        rig.quaternion.copy(correctionQuat);

      });
    </script>
  </body>
</html>
