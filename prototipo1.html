<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>AR World Tracking + Dead-Reckoning</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style> body{margin:0;overflow:hidden;} </style>
</head>

<body>
<a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
    <a-marker id="marker" preset="kanji"></a-marker>

    <a-box id="cubo" color="red" visible="false" scale="0.2 0.2 0.2" freeze-on-detect></a-box>

    <a-entity id="cameraRig">
      <a-entity camera></a-entity>
    </a-entity>
</a-scene>

<script>
  AFRAME.registerComponent('freeze-on-detect', {
    init: function () {
      const marker = document.querySelector('#marker');
      const cube = document.querySelector('#cubo');

      marker.addEventListener('markerFound', () => {
        // Obtener posición y rotación absolutas del marcador
        const markerPos = marker.object3D.getWorldPosition(new THREE.Vector3());
        const markerRot = marker.object3D.getWorldQuaternion(new THREE.Quaternion());

        // Colocar el cubo en esa posición del mundo
        cube.object3D.position.copy(markerPos);
        cube.object3D.quaternion.copy(markerRot);

        // Hacerlo visible
        cube.setAttribute('visible', true);
      });
    }
  });
</script>
</body>
</html>
