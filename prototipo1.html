<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hello, AR World! • A-Frame</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <!-- Shadow follow component from your sample -->
    <script>
      AFRAME.registerComponent('follow-shadow', {
        schema: {type: 'selector'},
        init() {this.el.object3D.renderOrder = -1;},
        tick() {
          if (this.data) {
            this.el.object3D.position.copy(this.data.object3D.position);
            this.el.object3D.position.y -= 0.001;
          }
        }
      });
    </script>

    <script>
        AFRAME.registerComponent('place-once-from-marker', {
        schema: { marker: { type: 'selector' } },

        init() {
            const marker = this.data.marker;
            const obj = this.el;

            marker.addEventListener('markerFound', () => {
            const worldPos = new THREE.Vector3();
            const worldQuat = new THREE.Quaternion();

            marker.object3D.getWorldPosition(worldPos);
            marker.object3D.getWorldQuaternion(worldQuat);

            obj.object3D.position.copy(worldPos);
            obj.object3D.quaternion.copy(worldQuat);

            obj.setAttribute("visible", true);

            // Turn off hit-test AFTER placing
            const scene = document.querySelector("a-scene");
            scene.removeAttribute("ar-hit-test");
            });
        }
        });
</script>
  </head>

  <body>
    <a-scene
    embedded
    renderer="colorManagement: true; exposure: 1; toneMapping: ACESFilmic"
    shadow="type: pcfsoft"
    
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    
    ar-hit-test="target: #objects;"
    xr-mode-ui="enabled: false"
>
    <!-- Marker -->
    <a-marker id="marker" preset="kanji"></a-marker>

    <!-- Directional light -->
    <a-light type="directional" light="castShadow:true;" 
             position="1 1 1" intensity="1.57"
             shadow-camera-automatic="#objects">
    </a-light>

    <!-- Objects (initially hidden; placed by marker once) -->
    <a-entity id="objects"
              scale="0.2 0.2 0.2"
              visible="false"
              place-once-from-marker="marker: #marker"
              shadow>
        <a-box position="-1 0.5 1" rotation="0 45 0" color="#4CC3D9"></a-box>
        <a-sphere position="0 1.25 -1" radius="1.25" color="#EF2D5E"></a-sphere>
        <a-cylinder position="1 0.75 1" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
    </a-entity>

    <!-- Shadow plane follows objects -->
    <a-plane follow-shadow="#objects"
             material="shader: shadow"
             shadow="cast:false;"
             rotation="-90 0 0"
             width="2" height="2">
    </a-plane>

    <a-sky color="#ECECEC" hide-on-enter-ar></a-sky>
</a-scene>
  </body>
</html>
