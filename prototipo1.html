<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Train AR Example</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="overflow: hidden;">

    <!-- Overlay text before enabling the scene -->
    <div id="startOverlay" 
         style="width: 100%; height: 100%; 
                display: flex; justify-content: center; align-items: center;
                background: rgba(0,0,0,0.7); color: white; font-size: 2em; cursor: pointer;">
      Click to Start AR
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false" 
             vr-mode-ui="enabled: false" 
             id="arScene" 
             style="display: none;">

      <a-camera id="camera" position="0 0 0"></a-camera>

        <a-entity id="train" 
                    gltf-model="https://s3-eu-west-1.amazonaws.com/fetchcfd/original/file-1571063936882.glb" 
                    position="-2 -0.75 -5" 
                    rotation="0 90 0"
                    scale="4 4 4">
        </a-entity>
        <a-entity id="person" 
                    gltf-model="https://threejs.org/examples/models/gltf/Soldier.glb" 
                    position="1.1 -1.5 -4" 
                    rotation="0 180 0"
                    scale="0.5 0.5 0.5">
        </a-entity>
        <a-plane 
            rotation="-90 0 0"
            position="0 -1.5 -4"
            scale="10 10 10"
            color="#FFF">
        </a-plane>
        <a-text value=
        "Hola, soy tu historiador
        del metro, hoy aprenderemos
        historia de la Linea 1"
            position="0 -0.5 -4" 
            rotation="0 0 0" 
            color="#FFF"
            aling="center"
            scale="0.5 0.5 0.5">
        </a-text>

    </a-scene>

    <script>
      const overlay = document.getElementById('startOverlay');
      const scene = document.getElementById('arScene');
      const camera = document.getElementById('camera');

      overlay.addEventListener('click', () => {
        overlay.style.display = 'none';
        scene.style.display = 'block';
        camera.object3D.rotation.set(0, 0, 0);
      });
    </script>
  </body>
</html>
