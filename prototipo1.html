<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Train AR Example</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="overflow: hidden;">

    <!-- Overlay text before enabling the scene -->
    <div id="startOverlay" 
        style="width: 100%; height: 100%; 
                display: flex; flex-direction: column; 
                justify-content: center; align-items: center;
                background: rgba(0,0,0,0.7); cursor: pointer; text-align: center;">

        <p style="color: white; font-size: 1.5em;">Please take a seat</p>
        <p style="color: white; font-size: 1.5em;">and place the QR in</p>
        <p style="color: white; font-size: 1.5em;">the center of the screen</p>

        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://http://127.0.0.1:5500/prototipo1.html" 
        alt="Scan QR" 
        style="display:block; margin:auto; opacity: 0.5;">
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false" 
             vr-mode-ui="enabled: false" 
             id="arScene" 
             style="display: none;">

      <a-camera id="camera" position="0 0 0"></a-camera>

        <a-entity id="train" 
                    gltf-model="https://s3-eu-west-1.amazonaws.com/fetchcfd/original/file-1571063936882.glb" 
                    rotation="0 90 0"
                    scale="10 10 10">
        </a-entity>
        <a-entity id="person" 
                    gltf-model="https://threejs.org/examples/models/gltf/Soldier.glb" 
                    rotation="0 180 0"
                    scale="1 1 1">
        </a-entity>
        <a-plane 
            id="plane1"
            rotation="-90 0 0"
            scale="100 20 10"
            color="#FFF">
        </a-plane>
        <a-text value=
        "Hola, soy tu historiador
        del metro, hoy aprenderemos
        historia de la Linea 1"
            id="text1"
            rotation="0 0 0" 
            color="#FFF"
            aling="center"
            scale="0.5 0.5 0.5">
        </a-text>

    </a-scene>

    <script>
    const overlay = document.getElementById("startOverlay");
    const scene = document.getElementById("arScene");
    const camera = document.getElementById("camera");

    overlay.addEventListener("click", () => {
        overlay.style.display = "none";
        scene.style.display = "block";

        // Dirección hacia donde mira la cámara
        const dir = new THREE.Vector3();
        camera.object3D.getWorldDirection(dir);

        // Posición base frente al usuario
        const basePos = camera.object3D.position.clone()

        // Objetos
        const train = document.getElementById("train").object3D;
        const person = document.getElementById("person").object3D;
        const plane1 = document.getElementById("plane1").object3D;
        const text1 = document.getElementById("text1").object3D;

        // Tu offset original respecto al centro de escena
        const offsets = {
            train: new THREE.Vector3(-5, -0, -20),
            person: new THREE.Vector3(1.1, -1.5, -10),
            plane1: new THREE.Vector3(0, -1.5, -7),
            text1: new THREE.Vector3(-1, -0.5, -10),
        };

        // Aplicar posiciones relativas
        train.position.copy(basePos.clone().add(offsets.train));
        person.position.copy(basePos.clone().add(offsets.person));
        plane1.position.copy(basePos.clone().add(offsets.plane1));
        text1.position.copy(basePos.clone().add(offsets.text1));

    });
    </script>
  </body>
</html>
